spring:
  application:
    name: estate-estimator-server
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:photos}
    access-key: ${S3_ACCESS_KEY:${MINIO_ROOT_USER}}
    secret-key: ${S3_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
    create-bucket-if-missing: ${S3_CREATE_BUCKET:false}
  jwt:
    # секрет HS256, минимум 32 байта; дефолт только для локальной разработки, в prod задавать через JWT_SECRET
    secret: ${JWT_SECRET:estate-estimator-local-dev-secret-do-not-use-in-prod}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  rate-limit:
    # защита от подбора учётных данных: лимиты на IP в минуту
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health
